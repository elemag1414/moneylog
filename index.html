<title>머니로그</title>

<style>
  :root {
    --paper:#faf7f2; --panel:#fffdf9; --ink:#17150f; --muted:#6d675c;
    --rule:#e3dbcd; --accent:#b5342a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#14120f; --panel:#1d1a16; --ink:#f3efe7; --muted:#9d968a;
      --rule:#332e27; --accent:#ef8b7e;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100dvh; display:flex; align-items:center;
    justify-content:center; padding:24px;
    background:var(--paper); color:var(--ink);
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
         "Segoe UI", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .card {
    width:100%; max-width:360px; background:var(--panel);
    border:1px solid var(--rule); border-radius:14px; padding:28px 24px;
  }
  .mark { width:34px; height:34px; margin-bottom:14px; display:block; }
  h1 { margin:0 0 4px; font-size:19px; letter-spacing:-.01em; }
  .sub { margin:0 0 22px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:7px; }
  input[type=password] {
    width:100%; padding:12px 13px; font-size:16px; font-family:inherit;
    color:var(--ink); background:var(--paper);
    border:1px solid var(--rule); border-radius:9px;
  }
  input[type=password]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .remember {
    display:flex; align-items:center; gap:8px; margin:13px 0 18px;
    font-size:13px; color:var(--muted);
  }
  .remember input { width:16px; height:16px; accent-color:var(--accent); }
  button {
    width:100%; padding:12px; font-size:15px; font-family:inherit; font-weight:600;
    color:#fff; background:var(--accent); border:0; border-radius:9px; cursor:pointer;
  }
  button:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:14px; font-size:13px; min-height:19px; color:var(--muted); }
  .msg.bad { color:var(--accent); }
  footer { margin-top:20px; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<main class="card">
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
       style="color:var(--accent)" aria-hidden="true">
    <path d="M23 6L13.5 15.5L8.5 10.5L1 18"/><path d="M17 6L23 6L23 12"/>
  </svg>
  <h1>머니로그</h1>
  <p class="sub">암호를 입력하면 이 기기 안에서 리포트를 풉니다.</p>

  <form id="form" autocomplete="on">
    <label for="pass">열람 암호</label>
    <input id="pass" type="password" autocomplete="current-password"
           autocapitalize="none" autocorrect="off" spellcheck="false"
           enterkeyhint="go" required>
    <div class="remember">
      <input id="save" type="checkbox" checked>
      <label for="save" style="margin:0">이 기기에 저장</label>
    </div>
    <button id="go" type="submit">열기</button>
  </form>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <footer>생성 2026-10-24 08:02 · 서버로 아무것도 보내지 않습니다</footer>
</main>

  }

  // 브라우저가 못 할 일을 미리 걸러낸다. 여기서 걸리면 암호가 맞아도 못 연다.
  //   crypto.subtle  — https 또는 localhost 에서만 존재한다
  //   DecompressionStream — iOS 16.4+ / 2023년 이후 브라우저
  if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
    say('보안 연결(https)에서만 열 수 있습니다.', true);
    go.disabled = true; return;
  }
  if (typeof DecompressionStream === 'undefined') {
    say('브라우저가 너무 오래되었습니다. iOS 16.4 이상이 필요합니다.', true);
    go.disabled = true; return;
  }

  function bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  var blob = JSON.parse(document.getElementById('payload').textContent);

  async function open(pass) {
    var base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: bytes(blob.salt), iterations: blob.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    // 암호가 틀리면 GCM 인증 태그 검증에서 여기가 throw 한다.
    var packed = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: bytes(blob.iv) }, key, bytes(blob.ct));
    var stream = new Blob([packed]).stream()
      .pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }

  function show(html) {
    // 문서를 통째로 원본 페이지로 갈아끼운다. 웹 뷰 쪽 코드는 손대지 않는다.
    document.open();
    document.write(html);
    document.close();
  }

  async function attempt(pass, quiet) {
    go.disabled = true;
    say('여는 중…');
    try {
      var html = await open(pass);
      if (save.checked) { try { localStorage.setItem(STORE, pass); } catch (e) {} }
      show(html);
    } catch (e) {
      try { localStorage.removeItem(STORE); } catch (e2) {}
      go.disabled = false;
      if (quiet) { say(''); return; }
      say('암호가 맞지 않습니다.', true);
      input.value = ''; input.focus();
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (input.value) attempt(input.value, false);
  });

  // 저장해둔 암호가 있으면 조용히 시도한다. 실패하면 평범한 잠금 화면으로 남는다.
  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) attempt(saved, true); else input.focus();
})();
</script>
</body>
</html>
